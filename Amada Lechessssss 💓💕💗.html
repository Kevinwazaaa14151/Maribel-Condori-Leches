<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌸 Hola mi amooooor!! 🌸</title>
  <link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(135deg, #ffd6e8, #e6ccff);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Flores de fondo */
    .flower {
      position: absolute;
      font-size: 1.8em;
      opacity: 0.6;
      animation: float 10s linear infinite;
      z-index: 0;
    }

    @keyframes float {
      0% { transform: translateY(0) rotate(0deg); opacity: 0.7; }
      50% { transform: translateY(-50px) rotate(180deg); opacity: 1; }
      100% { transform: translateY(0) rotate(360deg); opacity: 0.7; }
    }

    .card {
      background: rgba(255, 255, 255, 0.6);
      border-radius: 40px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      backdrop-filter: blur(10px);
      max-width: 800px;
      width: 90%;
      z-index: 10;
      position: relative;
    }

    h1 {
      font-family: 'Parisienne', cursive;
      font-size: 3em;
      color: #b04eb4;
      margin-bottom: 25px;
      text-shadow: 2px 2px 6px rgba(255,255,255,0.7);
    }

    /* Contenedor del video */
    .media-container {
      position: relative;
      width: 100%;
      max-width: 600px;
      padding-bottom: 56.25%; /* 16:9 ratio */
      border-radius: 25px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0,0,0,0.15);
      margin-bottom: 25px;
      border: 4px solid #f6b6d0;
    }

    .media-container .flower {
      font-size: 1.6em;
      opacity: 0.9;
      position: absolute;
      animation: swirl 8s infinite ease-in-out;
      z-index: 20;
    }

    @keyframes swirl {
      0% { transform: rotate(0deg) translate(0, 0); }
      25% { transform: rotate(15deg) translate(5px, -10px); }
      50% { transform: rotate(0deg) translate(0, 0); }
      75% { transform: rotate(-15deg) translate(-5px, 10px); }
      100% { transform: rotate(0deg) translate(0, 0); }
    }

    p {
      color: #5a3e6b;
      font-size: 1.2em;
      margin: 10px 0;
    }

    footer {
      margin-top: 15px;
      font-size: 0.9em;
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <!-- Flores de fondo -->
  <div class="flower" style="top:5%; left:10%;">🌸</div>
  <div class="flower" style="top:15%; right:10%;">🌸</div>
  <div class="flower" style="bottom:10%; left:15%;">🌸</div>
  <div class="flower" style="bottom:5%; right:20%;">🌸</div>
  <div class="flower" style="top:50%; left:45%;">🌸</div>

  <div class="card">
    <h1>Mi hermosa leches 💖</h1>

    <div class="media-container">
      <!-- Flores alrededor del video -->
      <div class="flower" style="top:-10px; left:20px;">🌸</div>
      <div class="flower" style="top:-10px; right:20px;">🌸</div>
      <div class="flower" style="bottom:-10px; left:25px;">🌸</div>
      <div class="flower" style="bottom:-10px; right:25px;">🌸</div>
      <div class="flower" style="top:50%; left:-15px;">🌸</div>
      <div class="flower" style="top:50%; right:-15px;">🌸</div>

      <!-- Video Serendipity -->
      <iframe src="https://www.youtube.com/embed/PTpGGtChomU" 
              frameborder="0" 
              allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" 
              allowfullscreen
              style="position:absolute; top:0; left:0; width:100%; height:100%;">
      </iframe>
    </div>

    <p>Te amo muchísimo, mi vida 🌸✨</p>
    <p>Amor de mi alma💕</p>
    <footer>Hecho con amor por Kevin 💫</footer>
  </div>

</body>
</html>
